        <script type="text/javascript">
            var map = L.map('map',{
                crs: L.CRS.Simple,
                renderer: L.svg()
            });
            var bounds = [[0,0], [1000,1000]]; // todo:sort the maths on this
            var image = L.imageOverlay('../map_exports/map_export.svg', bounds).addTo(map); // todo: create most recent file name dynamically
            map.fitBounds(bounds);
            L.control.Legend({
                legends: [{
                    label: 'Legend',
                    type: 'image',
                    url: '../map_exports/map_export_legend.svg'
                }],
            })
